services:
  appointment_facilitator.commands:
    class: Drupal\appointment_facilitator\Commands\AppointmentFacilitatorCommands
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
    tags:
      - { name: drush.command }

  appointment_facilitator.tool_stars_import_commands:
    class: Drupal\appointment_facilitator\Commands\ToolStarsImportCommands
    arguments:
      - '@entity_type.manager'
      - '@flag'
      - '@database'
    tags:
      - { name: drush.command }

  appointment_facilitator.schedule_audit_commands:
    class: Drupal\appointment_facilitator\Commands\ScheduleAuditCommands
    arguments:
      - '@entity_type.manager'
      - '@appointment_facilitator.schedule_consistency'
    tags:
      - { name: drush.command }

  appointment_facilitator.badge_health_commands:
    class: Drupal\appointment_facilitator\Commands\BadgeHealthCommands
    arguments:
      - '@entity_type.manager'
      - '@database'
    tags:
      - { name: drush.command }
